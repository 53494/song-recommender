<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎧 曲风点唱机 · 欢迎</title>
<style>
  :root{
    --ink:#3c4a43; --ink-soft:#7d8e85; --ink-faint:#a9b8b0;
    --mint:#7cc7a4; --mint-deep:#4fa983; --mint-soft:#e4f5ec;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    color:var(--ink);background:linear-gradient(160deg,#f4fbf5,#fff7f2 55%,#f3f8ff);
    -webkit-font-smoothing:antialiased;
  }
  /* 主页面预载：封面淡出后直接显示，无白屏等待 */
  #app{
    position:fixed;inset:0;width:100%;height:100%;border:0;
    opacity:0;transition:opacity .9s ease;background:#fff;
  }
  body.entered #app{opacity:1}

  .cover{
    position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:22px;
    background:
      radial-gradient(760px 560px at 12% 8%, #dff3e6 0%, transparent 62%),
      radial-gradient(700px 560px at 88% 12%, #ffe9e2 0%, transparent 60%),
      radial-gradient(760px 620px at 50% 108%, #e6f0ff 0%, transparent 62%),
      linear-gradient(160deg,#f4fbf5,#fff7f2 55%,#f3f8ff);
    transition:opacity .9s ease,transform .9s ease,visibility .9s;
  }
  body.entered .cover{opacity:0;transform:scale(1.06);visibility:hidden;pointer-events:none}

  .note{position:absolute;font-size:24px;opacity:.5;animation:float 8s ease-in-out infinite;pointer-events:none}
  .n1{top:14%;left:12%;animation-delay:0s}.n2{top:22%;right:14%;font-size:19px;animation-delay:1.5s}
  .n3{bottom:20%;left:16%;font-size:21px;animation-delay:3s}.n4{bottom:16%;right:12%;animation-delay:4.2s}
  .n5{top:48%;left:6%;font-size:16px;animation-delay:2.4s}.n6{top:42%;right:7%;font-size:17px;animation-delay:5.1s}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-18px) rotate(10deg)}}

  .card{
    position:relative;text-align:center;padding:52px 46px 42px;border-radius:34px;
    background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.95);
    box-shadow:0 24px 60px rgba(90,130,105,.16),0 4px 14px rgba(90,130,105,.06);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    max-width:440px;width:100%;
    animation:rise .8s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .halo{
    width:88px;height:88px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
    font-size:40px;background:linear-gradient(140deg,var(--mint-soft),#fff);
    box-shadow:0 8px 24px rgba(124,199,164,.24),inset 0 0 0 1px #fff;
    animation:bob 4.5s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  h1{
    font-size:44px;font-weight:700;letter-spacing:10px;margin:0 0 6px;padding-left:10px;
    background:linear-gradient(100deg,var(--mint-deep),#6aa9c9);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{font-size:12px;letter-spacing:3px;color:var(--ink-faint);margin:0 0 16px}
  .desc{font-size:13.5px;color:var(--ink-soft);line-height:1.8;margin:0 0 28px}
  .enter{
    border:none;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.5px;cursor:pointer;
    padding:15px 38px;border-radius:999px;color:#fff;
    background:linear-gradient(135deg,var(--mint),var(--mint-deep));
    box-shadow:0 10px 24px rgba(79,169,131,.3);transition:.2s ease;
  }
  .enter:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(79,169,131,.38)}
  .enter:active{transform:translateY(0) scale(.97)}
  .hint{font-size:11.5px;color:var(--ink-faint);margin:16px 0 0;line-height:1.7}

  .music-toggle{
    position:fixed;right:22px;bottom:22px;z-index:15;width:48px;height:48px;border-radius:50%;
    border:1px solid #fff;background:rgba(255,255,255,.92);font-size:20px;cursor:pointer;
    box-shadow:0 8px 22px rgba(90,130,105,.18);transition:.2s ease;
  }
  .music-toggle:hover{transform:scale(1.1)}
  .music-toggle.off{opacity:.6;filter:grayscale(.5)}
  @media(max-width:480px){
    .card{padding:40px 26px 34px}h1{font-size:36px;letter-spacing:8px}
    .note{font-size:18px}
  }
</style>
</head>
<body>
  <iframe id="app" src="song-recommender.html" title="曲风点唱机"></iframe>

  <button id="musicToggle" class="music-toggle" title="音乐开关" aria-label="音乐开关">🎵</button>

  <div id="cover" class="cover">
    <span class="note n1">🍃</span><span class="note n2">🎵</span>
    <span class="note n3">🌸</span><span class="note n4">✨</span>
    <span class="note n5">♪</span><span class="note n6">♫</span>
    <div class="card">
      <div class="halo">🎧</div>
      <h1>欢迎</h1>
      <p class="sub">WELCOME · 歡迎</p>
      <p class="desc">挑个年代，让音乐随机撞进耳朵里 🌿<br>四种曲风，一百二十首歌，慢慢听。</p>
      <button id="enterBtn" class="enter">🎵 进入点唱机</button>
      <p class="hint" id="musicHint">♪ 轻音乐将在进入时响起 · 右下角可随时开关</p>
    </div>
  </div>

<script>
/* ============================================================
   轻音乐：Web Audio 实时合成，无需外部音频文件、无版权依赖
   和弦进行 Cmaj7 → Am7 → Fmaj7 → G7，柔和 pad + 音乐盒琶音 + 低音
   浏览器自动播放策略：无用户手势时 AudioContext 会被挂起，
   因此页面加载先尝试播放，失败则由「进入」按钮兜底启动。
   ============================================================ */
(function(){
  var BAR = 3.4;
  var CHORDS = [
    {root:48, notes:[60,64,67,71]},  // Cmaj7
    {root:45, notes:[57,60,64,67]},  // Am7
    {root:41, notes:[53,57,60,64]},  // Fmaj7
    {root:43, notes:[55,59,62,65]}   // G7
  ];
  var VOL = 0.16;
  var ctx=null, master=null, started=false, muted=false;
  var nextTime=0, barIdx=0, timer=null;

  function mtof(m){ return 440*Math.pow(2,(m-69)/12); }

  function makeImpulse(c,seconds,decay){
    var rate=c.sampleRate, len=Math.floor(rate*seconds), buf=c.createBuffer(2,len,rate);
    for(var ch=0;ch<2;ch++){
      var d=buf.getChannelData(ch);
      for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
    }
    return buf;
  }

  function setup(){
    if(ctx) return;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=0;
    var dry=ctx.createGain(); dry.gain.value=0.85;
    master.connect(dry); dry.connect(ctx.destination);
    var conv=ctx.createConvolver(); conv.buffer=makeImpulse(ctx,2.4,2.6);
    var wet=ctx.createGain(); wet.gain.value=0.3;
    master.connect(conv); conv.connect(wet); wet.connect(ctx.destination);
  }

  function pad(midi,t,dur){
    var o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    o.type="triangle"; o.frequency.value=mtof(midi);
    f.type="lowpass"; f.frequency.value=1400;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.05,t+1.1);
    g.gain.setValueAtTime(0.05,t+dur-1.2);
    g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(t); o.stop(t+dur+0.05);
  }
  function bell(midi,t){
    var o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain(), g2=ctx.createGain();
    o.type="sine"; o.frequency.value=mtof(midi);
    o2.type="sine"; o2.frequency.value=mtof(midi)*2.001;
    g2.gain.value=0.25;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.07,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    o.start(t); o2.start(t); o.stop(t+1.7); o2.stop(t+1.7);
  }
  function bass(midi,t,dur){
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.value=mtof(midi);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.055,t+0.8);
    g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+dur+0.05);
  }
  function scheduleChord(ch,t){
    bass(ch.root-12,t,BAR);
    for(var i=0;i<ch.notes.length;i++) pad(ch.notes[i],t,BAR);
    var seq=[0,1,2,3,2,1,3,2];
    for(var k=0;k<seq.length;k++){
      bell(ch.notes[seq[k]]+12, t+0.15+k*(BAR/seq.length));
    }
  }
  function scheduler(){
    if(!ctx||ctx.state!=="running") return;
    var now=ctx.currentTime;
    if(nextTime<now+0.05) nextTime=now+0.05;
    while(nextTime<now+1.2){
      scheduleChord(CHORDS[barIdx%CHORDS.length],nextTime);
      nextTime+=BAR; barIdx++;
    }
  }
  function fade(v){
    if(!master||!ctx) return;
    var now=ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value,now);
    master.gain.linearRampToValueAtTime(v,now+1.5);
  }
  function startMusic(){
    setup();
    if(!ctx) return;
    if(ctx.state!=="running"){ try{ ctx.resume(); }catch(e){} }
    if(started){ fade(muted?0:VOL); return; }
    started=true;
    nextTime=ctx.currentTime+0.1; barIdx=0;
    scheduler();
    timer=setInterval(scheduler,250);
    fade(muted?0:VOL);
  }
  function tryAutoplay(){
    setup();
    if(!ctx) return Promise.resolve(false);
    return ctx.resume().then(function(){
      if(ctx.state==="running"){ startMusic(); return true; }
      return false;
    }).catch(function(){ return false; });
  }

  var cover=document.getElementById("cover");
  var enterBtn=document.getElementById("enterBtn");
  var hint=document.getElementById("musicHint");
  var toggle=document.getElementById("musicToggle");

  // 加载即尝试播放；成功则直接有音乐，失败由用户手势兜底
  tryAutoplay().then(function(ok){
    if(ok) hint.textContent="♪ 轻音乐播放中 · 右下角可随时开关";
  });
  // 任意首次交互都启动音乐（点击背景也有效）
  document.addEventListener("pointerdown",startMusic,{once:true});

  enterBtn.addEventListener("click",function(){
    startMusic();
    document.body.classList.add("entered");
    setTimeout(function(){ cover.style.display="none"; },950);
  });

  toggle.addEventListener("click",function(){
    muted=!muted;
    toggle.textContent=muted?"🔇":"🎵";
    toggle.classList.toggle("off",muted);
    if(muted) fade(0); else { startMusic(); fade(VOL); }
  });
})();
</script>
</body>
</html>
